<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>יאללה בוא נלך!</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 340px; text-align: center; }
    h1 { color: #2c3e50; font-size: 20px; margin-bottom: 10px; }
    p { font-size: 13px; color: #666; margin-bottom: 15px; }
    input, select { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 12px; background: #27ae60; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    button:hover { background: #219150; }
    .hidden { display: none; }
    #map { height: 180px; width: 100%; border-radius: 8px; margin-top: 10px; }
    .partner-item { background: #f9f9f9; padding: 10px; border-radius: 6px; margin: 8px 0; text-align: right; font-size: 13px; border-right: 4px solid #27ae60; }
    .filter-box { background: #eef9f1; padding: 10px; border-radius: 8px; margin-bottom: 10px; text-align: right; font-size: 13px; }
    .filter-box label { font-weight: bold; color: #2c3e50; display: block; margin-bottom: 4px; }
    .chat-box { height: 160px; border: 1px solid #ccc; border-radius: 8px; padding: 10px; overflow-y: auto; text-align: right; font-size: 13px; background: #fafafa; display: flex; flex-direction: column; gap: 8px; }
    .msg-wrapper-user { text-align: left; }
    .msg-wrapper-partner { text-align: right; }
    .msg-user { background: #dcf8c6; padding: 6px 12px; border-radius: 12px; display: inline-block; max-width: 80%; }
    .msg-partner { background: #fff; padding: 6px 12px; border-radius: 12px; display: inline-block; border: 1px solid #eee; max-width: 80%; }
  </style>
</head>
<body>

  <!-- מסך ראשי -->
  <div class="card" id="mainScreen">
    <h1>🗺️ פרטנרים בסביבה</h1>
    
    <div class="filter-box">
      <label for="paceFilter">🏃‍♂️ קצב הליכה:</label>
      <select id="paceFilter" onchange="filterPartners()">
        <option value="all">הכל</option>
        <option value="איטי">איטי</option>
        <option value="בינוני">בינוני</option>
        <option value="מהיר">מהיר</option>
        <option value="ריצה">ריצה</option>
      </select>

      <label style="margin-top: 8px;">📍 מרחק מרבי: <span id="distVal">5</span> ק"מ</label>
      <input type="range" id="distFilter" min="1" max="10" value="5" oninput="updateDistVal(); filterPartners();">
    </div>

    <div id="map"></div>
    <div id="partnersList" style="margin-top: 10px;"></div>

    <button style="margin-top: 12px;" onclick="openChat()">💬 צור קשר להליכה</button>
  </div>

  <!-- מסך צ'אט -->
  <div class="card hidden" id="chatScreen">
    <h1>💬 שיחה עם דניאל</h1>
    <div class="chat-box" id="chatBox">
      <div class="msg-wrapper-partner"><span class="msg-partner">היי! יוצא להליכה בקריות עוד מעט. מצטרף?</span></div>
    </div>
    <input type="text" id="chatInput" placeholder="רשום הודעה ואנטר לשליחה..." style="margin-top: 10px;">
    <button onclick="sendMsg()" style="margin-top: 6px;">שלח</button>
    <button onclick="backToMap()" style="background: #7f8c8d; margin-top: 6px;">חזרה למפה</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const userPos = { lat: 32.835, lng: 35.076 };
    const map = L.map('map').setView([userPos.lat, userPos.lng], 13);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // סמן מיקום משתמש
    L.circleMarker([userPos.lat, userPos.lng], { radius: 7, color: '#27ae60', fillColor: '#27ae60', fillOpacity: 0.8 })
      .addTo(map).bindPopup("<b>המיקום שלך</b>");

    const partners = [
      { id: 1, name: "דניאל", location: "מוצקין", pace: "בינוני", dist: 1.2, lat: 32.838, lng: 35.078 },
      { id: 2, name: "מיכל", location: "קריות", pace: "מהיר", dist: 3.8, lat: 32.832, lng: 35.075 },
      { id: 3, name: "עומר", location: "ביאליק", pace: "איטי", dist: 6.5, lat: 32.820, lng: 35.085 }
    ];

    function renderPartners() {
      const listContainer = document.getElementById('partnersList');
      listContainer.innerHTML = '';

      partners.forEach(partner => {
        partner.marker = L.marker([partner.lat, partner.lng])
          .addTo(map)
          .bindPopup(`<b>${partner.name}</b> - ${partner.location}<br>קצב: ${partner.pace}<br>מרחק: ${partner.dist} ק"מ`);

        const item = document.createElement('div');
        item.className = 'partner-item';
        item.id = `partner-${partner.id}`;
        item.innerHTML = `<b>${partner.name}</b> - ${partner.location} (${partner.dist} ק"מ)<br>קצב: <b>${partner.pace}</b>`;
        listContainer.appendChild(item);
      });
    }

    function updateDistVal() {
      document.getElementById('distVal').innerText = document.getElementById('distFilter').value;
    }

    function filterPartners() {
      const selectedPace = document.getElementById('paceFilter').value;
      const maxDist = parseFloat(document.getElementById('distFilter').value);

      partners.forEach(partner => {
        const matchesPace = (selectedPace === 'all' || partner.pace === selectedPace);
        const matchesDist = partner.dist <= maxDist;
        const isVisible = matchesPace && matchesDist;

        if (partner.marker) {
          if (isVisible) {
            partner.marker.addTo(map);
          } else {
            map.removeLayer(partner.marker);
          }
        }

        const itemElement = document.getElementById(`partner-${partner.id}`);
        if (itemElement) {
          itemElement.style.display = isVisible ? 'block' : 'none';
        }
      });
    }

    function openChat() {
      document.getElementById('mainScreen').classList.add('hidden');
      document.getElementById('chatScreen').classList.remove('hidden');
    }

    function backToMap() {
      document.getElementById('chatScreen').classList.add('hidden');
      document.getElementById('mainScreen').classList.remove('hidden');
    }

    function sendMsg() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML += `<div class="msg-wrapper-user"><span class="msg-user">${text}</span></div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      setTimeout(() => {
        let reply = "";
        const lowerText = text.toLowerCase();

        if (lowerText.includes("לא") || lowerText.includes("פחות") || lowerText.includes("עסוק")) {
          reply = "חבל! אולי בפעם אחרת? 🙂";
        } else if (lowerText.includes("כן") || lowerText.includes("סגור") || lowerText.includes("בטח") || lowerText.includes("מעולה")) {
          reply = "מעולה! נפגש עוד 10 דקות 🔥";
        } else if (lowerText.includes("איפה") || lowerText.includes("מתי")) {
          reply = "בפארק המרכזי בעוד כ-15 דקות, מתאים?";
        } else {
          reply = "סגור, נשתמע קרוב לזמן היציאה!";
        }

        chatBox.innerHTML += `<div class="msg-wrapper-partner"><span class="msg-partner">${reply}</span></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 800);
    }

    // האזנה למקש Enter בצ'אט
    document.getElementById('chatInput').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        sendMsg();
      }
    });

    renderPartners();
  </script>
</body>
</html>
