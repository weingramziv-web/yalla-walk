<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>יאללה בוא נלך!</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 340px; text-align: center; }
    h1 { color: #2c3e50; font-size: 20px; margin-bottom: 10px; }
    p { font-size: 13px; color: #666; margin-bottom: 15px; }
    input, select { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 12px; background: #27ae60; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    button:hover { background: #219150; }
    .hidden { display: none; }
    #map { height: 180px; width: 100%; border-radius: 8px; margin-top: 10px; }
    .partner-item { background: #f9f9f9; padding: 10px; border-radius: 6px; margin: 8px 0; text-align: right; font-size: 13px; border-right: 4px solid #27ae60; }
    .filter-box { background: #eef9f1; padding: 10px; border-radius: 8px; margin-bottom: 10px; text-align: right; font-size: 13px; }
    .filter-box label { font-weight: bold; color: #2c3e50; display: block; margin-bottom: 4px; }
    .chat-box { height: 150px; border: 1px solid #ccc; border-radius: 8px; padding: 10px; overflow-y: auto; text-align: right; font-size: 13px; background: #fafafa; }
    .msg-user { background: #dcf8c6; padding: 6px 10px; border-radius: 8px; margin: 4px 0; display: inline-block; }
    .msg-partner { background: #fff; padding: 6px 10px; border-radius: 8px; margin: 4px 0; display: inline-block; border: 1px solid #eee; }
  </style>
</head>
<body>

  <div class="card" id="mainScreen">
    <h1>🗺️ פרטנרים בסביבה</h1>
    
    <!-- סרגל סינון לפי קצב -->
    <div class="filter-box">
      <label for="paceFilter">🏃‍♂️ סינון לפי קצב הליכה:</label>
      <select id="paceFilter" onchange="filterByPace()">
        <option value="all">הכל</option>
        <option value="איטי">איטי</option>
        <option value="בינוני">בינוני</option>
        <option value="מהיר">מהיר</option>
        <option value="ריצה">ריצה</option>
      </select>
    </div>

    <!-- מפה -->
    <div id="map"></div>

    <!-- רשימת פרטנרים -->
    <div id="partnersList" style="margin-top: 10px;"></div>

    <button style="margin-top: 12px;" onclick="openChat()">💬 צור קשר להליכה</button>
  </div>

  <!-- מסך צ'אט -->
  <div class="card hidden" id="chatScreen">
    <h1>💬 שיחה עם דניאל</h1>
    <div class="chat-box" id="chatBox">
      <div class="msg-partner">היי! יוצא להליכה בקריות עוד מעט. מצטרף?</div>
    </div>
    <input type="text" id="chatInput" placeholder="רשום הודעה..." style="margin-top: 10px;">
    <button onclick="sendMsg()" style="margin-top: 6px;">שלח</button>
    <button onclick="backToMap()" style="background: #7f8c8d; margin-top: 6px;">חזרה למפה</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // יצירת המפה
    const map = L.map('map').setView([32.835, 35.076], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // נתוני הפרטנרים
    const partners = [
      { id: 1, name: "דניאל", location: "מוצקין", pace: "בינוני", lat: 32.838, lng: 35.078 },
      { id: 2, name: "מיכל", location: "קריות", pace: "מהיר", lat: 32.832, lng: 35.075 }
    ];

    // הוספת הסמנים למפה והרשימה
    function renderPartners() {
      const listContainer = document.getElementById('partnersList');
      listContainer.innerHTML = '';

      partners.forEach(partner => {
        // יצירת סמן במפה
        partner.marker = L.marker([partner.lat, partner.lng])
          .addTo(map)
          .bindPopup(`<b>${partner.name}</b> - ${partner.location}<br>קצב: ${partner.pace}`);

        // יצירת אלמנט ברשימה
        const item = document.createElement('div');
        item.className = 'partner-item';
        item.id = `partner-${partner.id}`;
        item.innerHTML = `<b>${partner.name}</b> - ${partner.location} | קצב: <b>${partner.pace}</b>`;
        listContainer.appendChild(item);
      });
    }

    // פונקציית הסינון
    function filterByPace() {
      const selectedPace = document.getElementById('paceFilter').value;

      partners.forEach(partner => {
        const isVisible = (selectedPace === 'all' || partner.pace === selectedPace);

        // עדכון הסמנים במפה
        if (partner.marker) {
          if (isVisible) {
            partner.marker.addTo(map);
          } else {
            map.removeLayer(partner.marker);
          }
        }

        // עדכון ברשימה
        const itemElement = document.getElementById(`partner-${partner.id}`);
        if (itemElement) {
          itemElement.style.display = isVisible ? 'block' : 'none';
        }
      });
    }

    // ניהול צ'אט
    function openChat() {
      document.getElementById('mainScreen').classList.add('hidden');
      document.getElementById('chatScreen').classList.remove('hidden');
    }

    function backToMap() {
      document.getElementById('chatScreen').classList.add('hidden');
      document.getElementById('mainScreen').classList.remove('hidden');
    }

    function sendMsg() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML += `<div><span class="msg-user">${text}</span></div>`;
      input.value = '';

      setTimeout(() => {
        chatBox.innerHTML += `<div><span class="msg-partner">מעולה! נפגש עוד 10 דקות 🔥</span></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 1000);
    }

    // הפעלה ראשונית
    renderPartners();
  </script>
</body>
</html>
